<script>
/* ===== DATENLOGIK (alle Beträge in ganzen Cent) ===== */
const LKEY='pzbd.led',KEY='pzbd.v1',DEF={balance:78493.54,allow:55,min:4800,max:6500,extra:207,start:2023,keep:false};
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const e100=x=>Math.round(x*100);
function load(){try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(x){return{...DEF}}}
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const VAR=[
[16,['PENNY','tegut','ALDI','Lidl'],'Lebensmittel',6,95],
[6,['REWE','EDEKA','Kaufland','Netto'],'Lebensmittel',9,120],
[4,['Amazon Marketplace'],'Online-Shopping',14,160],
[3,['Renthof Kassel','Kaskadenwirtschaft Grischäfer'],'Restaurants',28,130],
[4,["McDonald’s",'Burger King','Subway'],'Restaurants',7,24],
[9,['Nenninger Café','Café Streiter','Starbucks','Tchibo'],'Cafés',3.2,14],
[4,['Aral','Shell','Jet Tankstelle','Esso'],'Tankstellen',42,95],
[2,['Apotheke Kassel'],'Apotheken',6,55],
[1.5,['dm-drogerie markt','Rossmann'],'Drogerie',5,45],
[2,['CineStar Kassel','Cineplex Capitol','Gloria Kino'],'Freizeit',12,48],
[2,['Staatstheater Kassel','Kurhessen Therme','GRIMMWELT Kassel','Auebad Kassel'],'Freizeit',8,120],
[3,['Geldautomat'],'Bargeld',50,300,'Bargeldabhebung'],
[1.5,['KVG Kassel'],'Mobilität',3,12],
[1.5,['Deutsche Bahn','Uber','FlixBus'],'Mobilität',9,120],
[1.5,['Zalando'],'Mode',40,260],[1.2,['H&M'],'Mode',20,150],[.8,['Foot Locker'],'Mode',60,180],
[.8,['MediaMarkt','Saturn'],'Elektronik',30,700],[.6,['Booking.com','Lufthansa','Airbnb'],'Reisen',180,1400]];
const VW=VAR.reduce((s,v)=>s+v[0],0);
const key=t=>((t.y*100+t.m)*100+t.d)*1440+t.t;
function fin(T,S,op){T.sort((a,b)=>key(a)-key(b));const open=(S.keep!==false||op==null)?e100(S.balance)-T.reduce((s,t)=>s+t.c,0):op;let b=open;
 T.forEach((t,i)=>{t.id=i+1;t.type=t.c>0?'Einnahme':'Ausgabe';b+=t.c;t.bal=b;t.ref='REF-'+String(i+1).padStart(5,'0')});return{tx:T,open,end:b}}
function build(S,sh){
 const R=rng(7919+S.start),rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(R()*a.length)],T=[];
 const add=(y,m,d,t,name,cat,c,meth,txt)=>T.push({y,m,d,t,name,cat,c,meth,txt});
 const ct=n=>'Kartenzahlung '+n+' · Visa Infinite **** 4821';
 for(let k=0;;k++){
  const y=S.start+Math.floor((10+k)/12),m=(10+k)%12+1;if(y>2026||y==2026&&m>11)break;
  const last=y==2026&&m==11,md=last?3:new Date(y,m,0).getDate(),mn=MN[m-1]+' '+y;
  const g=Math.min(S.max,Math.max(S.min,Math.round(rnd(S.min,S.max)/50)*50));
  add(y,m,last?2:ri(2,9),ri(360,560),'Heinrich Zeismann','Einkommen',e100(g),'Überweisung','Zuwendung Großvater '+mn);
  if(S.allow>0)add(y,m,1,300,'Familie Zeismann','Einkommen',e100(S.allow),'Dauerauftrag','Taschengeld '+mn);
  if(last&&S.extra>0)add(y,m,3,490,'Heinrich Zeismann','Einkommen',e100(S.extra),'Überweisung','Zusätzlicher Geldeingang '+mn);
  let fx=0,lx=0;
  [[1,'Hausverwaltung Kassel','Wohnen',1380,'Dauerauftrag','Miete '+mn],[4,'Städtische Werke Kassel','Wohnen',rnd(95,125),'Lastschrift','Abschlag Strom/Gas'],
   [12,'Mobilfunk Vodafone','Abonnements',39.99,'Lastschrift','Mobilfunkvertrag'],[7,'Netflix','Abonnements',13.99,'Kartenzahlung','Streaming-Abo'],
   [9,'Spotify','Abonnements',10.99,'Kartenzahlung','Musik-Abo'],[1,'NVV Deutschlandticket','Mobilität',y<2025?49:58,'Lastschrift','Monatsabo ÖPNV'],
   [2,'McFit','Freizeit',49.9,'Lastschrift','Mitgliedsbeitrag'],[15,'Allianz Versicherung','Versicherungen',38.9,'Lastschrift','Beitrag '+mn]
  ].forEach(([d,n,c,a,me,tx])=>{if(d<=md){a=e100(a);fx+=a;add(y,m,d,ri(420,900),n,c,-a,me,me=='Kartenzahlung'?ct(n):tx)}});
  [[13,6,'HERMÈS',[690,890,1190,1450]],[9,4,'PRADA',[490,650,790,1090]]].forEach(([q,z,n,v])=>{
   if(k%q==z){const a=e100(pick(v));lx+=a;add(y,m,ri(1,md),ri(660,1140),n,'Luxus & Mode',-a,'Kartenzahlung',ct(n))}});
  let B=Math.round((rnd(.6,.76)+sh)*g*100)-fx-lx;B=last?15000:Math.max(30000,B);
  for(let n=0,sp=0;n<90&&sp<B-1500;n++){
   let r=R()*VW,v;for(v of VAR){if((r-=v[0])<0)break}
   const[,nm,cat,lo,hi,me]=v,name=pick(nm),a=e100(me?Math.round(rnd(lo,hi)/10)*10:rnd(lo,hi));
   if(!a||sp+a>B+4000)continue;sp+=a;
   add(y,m,ri(1,md),ri(480,1260),name,cat,-a,me||'Kartenzahlung',me?'Bargeldabhebung Geldautomat · **** 4821':ct(name));
  }
 }
 return fin(T,S);
}
function gen(S){let sh=0,o;for(let i=0;i<14;i++){o=build(S,sh);if(o.open>=250000&&o.open<=1500000)break;sh=Math.max(-.3,Math.min(.25,sh+(o.open<250000?.015:-.015)))}return o}
let S=load(),LED=null;try{LED=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(x){}
let DB=LED&&LED.tx&&LED.tx.length?fin(LED.tx,{...S,keep:false},LED.open):(LED=null,gen(S));
//@@UI
/* ===== DARSTELLUNG ===== */
const $=s=>document.querySelector(s);
const eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const sg=c=>(c>0?'+':'−')+eur(Math.abs(c));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),dt=t=>p2(t.d)+'.'+p2(t.m)+'.'+t.y,today=()=>{const n=new Date();return p2(n.getDate())+'.'+p2(n.getMonth()+1)+'.'+n.getFullYear()};
const col=s=>'hsl('+([...s].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360)+' 42% 38%)';
const sm=(a,inc)=>a.filter(t=>inc?t.c>0:t.c<0).reduce((s,t)=>s+Math.abs(t.c),0);
const row=t=>`<div class="row" data-id="${t.id}"><i style="background:${col(t.cat)}">${esc(t.name[0])}</i><div class="m"><b>${esc(t.name)}</b><small>${esc(t.cat)} · ${dt(t)}</small></div><div class="a ${t.c>0?'p':''}">${sg(t.c)}<small>Saldo ${eur(t.bal)}</small></div></div>`;
function spark(){const m={};DB.tx.forEach(t=>m[t.y*12+t.m]=t.bal);const v=Object.keys(m).sort((a,b)=>a-b).slice(-13).map(k=>m[k]),lo=Math.min(...v),rg=(Math.max(...v)-lo)||1;
 return`<svg viewBox="0 0 300 70" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${v.map((x,i)=>(i*300/(v.length-1||1)).toFixed(1)+','+(64-(x-lo)/rg*56).toFixed(1)).join(' ')}"/></svg>`}

|Lockheed Martin|420|U;CAT|Caterpillar|400|U;GS|Goldman Sachs|600|U;MS|Morgan Stanley|130|U;BAC|Bank of America|45|U;C|Citigroup|75|U;WFC|Wells Fargo|75|U;VZ|Verizon|38|U;T|AT&T|24|U;TMUS|T-Mobile US|190|U;HON|Honeywell|190|U;UPS|UPS|85|U;MMM|3M|140|U;GE|GE Aerospace|250|U;AMAT|Applied Materials|170|U;TXN|Texas Instruments|170|U;NOW|ServiceNow|800|U;INTU|Intuit|600|U;BKNG|Booking Holdings|4500|U;LOW|Lowe’s|220|U;TGT|Target|100|U;DE|Deere|450|U;RTX|RTX|140|U;CMCSA|Comcast|30|U;AXP|American Express|300|U;BLK|BlackRock|900|U;ABT|Abbott|110|U;TMO|Thermo Fisher|480|U;DHR|Danaher|200|U;MDT|Medtronic|85|U;AMGN|Amgen|270|U;GILD|Gilead|100|U;NEE|NextEra Energy|70|U;RIVN|Rivian|12|U';
const BASE=RAW.split(';').map(x=>{const a=x.split('|');return[a[0],a[1],+a[2],a[3]==='U']}),SAVR=3.6,DK='pzbd.dep';
let DEP={pos:{},sav:{b:0,t:Date.now(),in:0},px:{},ref:{},key:'',fx:1.15,live:false,rd:'',custom:[],lv:{},rules:{}};
try{Object.assign(DEP,JSON.parse(localStorage.getItem(DK)||'{}'))}catch(x){}
const ALL=()=>BASE.concat(DEP.custom),dsave=()=>wr(DK,DEP),px=k=>DEP.px[k]||ALL().find(a=>a[0]==k)[2],sav=()=>DEP.sav.b*Math.pow(1+SAVR/100,(Date.now()-DEP.sav.t)/31557600000);
function depReset(){DEP.rules={};DEP.pos={};DEP.sav={b:0,t:Date.now(),in:0};dsave()}
function dayRef(){if(DEP.rd!=today()){DEP.rd=today();DEP.ref={};ALL().forEach(([k])=>DEP.ref[k]=px(k))}}
function book(name,cat,c,meth,txt){const n=new Date();DB.tx.push({y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate(),t:n.getHours()*60+n.getMinutes(),name,cat,c,meth,txt});DB=fin(DB.tx,{...S,keep:false},DB.open);saveLed()}
function stRows(){const q=DQ.q.trim().toLowerCase(),L=ALL().filter(a=>(!DQ.own||DEP.pos[a[0]])&&(!q||(a[0]+' '+a[1]).toLowerCase().includes(q)));
 return L.length?L.map(([k,n])=>{const p=px(k),P=DEP.pos[k],ch=p/(DEP.ref[k]||p)-1;return`<div class="row" data-sym="${esc(k)}"><i>${esc(n[0])}</i><div class="m"><b>${esc(n)}</b><small>${esc(k)}${P?' · '+P.q.toFixed(3).replace('.',',')+' Stk. · '+eur(Math.round(P.q*p*100)):''}${DEP.rules[k]?' · Auto-Verkauf':''}</small></div><div class="a">${eur(Math.round(p*100))}<small class="${ch>=0?'p':'n'}">${ch>=0?'+':'−'}${Math.abs(ch*100).toFixed(2).replace('.',',')} %</small></div></div>`}).join(''):'<small>Keine Treffer.</small>'}
function sumHtml(){let v=0,c=0,d=0;for(const k in DEP.pos){v+=DEP.pos[k].q*px(k)*100;c+=DEP.pos[k].cost;d+=DEP.pos[k].q*(px(k)-(DEP.ref[k]||px(k)))*100}const sv=sav(),pl=v-c;
 return`<div class="grid"><div class="card"><small>Aktiendepot</small><b>${eur(Math.round(v))}</b><small class="${pl>=0?'p':'n'}">${pl>=0?'+':'−'}${eur(Math.abs(Math.round(pl)))} seit Kauf</small><br><small class="${d>=0?'p':'n'}">${d>=0?'+':'−'}${eur(Math.abs(Math.round(d)))} heute</small></div><div class="card"><small>Spardepot</small><b>${eur(Math.round(sv))}</b><small class="p">+${eur(Math.round(sv*SAVR/36500))} pro Tag</small></div><div class="card"><small>Depots gesamt</small><b>${eur(Math.round(v+sv))}</b></div></div>`}
let DQ={q:'',own:false};
function dep(){setTimeout(paint,0);return`<h2>Depot</h2><div id="dsum">${sumHtml()}</div><h2>Aktien (${ALL().length})</h2><div class="card"><input id="d_q" type="search" placeholder="Aktie oder Symbol suchen, z. B. Siemens, AAPL" value="${esc(DQ.q)}" autocomplete="off"><div class="seg">${[['0','Alle'],['1','Meine Aktien']].map(([v,l])=>`<button data-o="${v}" class="${(DQ.own?'1':'0')==v?'on':''}">${l}</button>`).join('')}</div></div><div class="card" id="stocks">${stRows()}</div><small id="dst"></small>
<h2>Spardepot</h2><div class="card"><b>Festzins ${String(SAVR.toFixed(2)).replace('.',',')} % p. a.</b><br><small>Der Wert steigt jeden Tag, ohne Schwankung.</small><div class="btns" style="margin-top:12px"><button class="btn pri" data-act="savm">Einzahlen / Auszahlen</button></div></div>
<h2>Kursquelle</h2><div class="card"><div class="f" style="max-width:none"><label>Finnhub-API-Schlüssel (optional)<input id="d_key" autocomplete="off" value="${esc(DEP.key)}"><small>Kostenlos auf finnhub.io. Damit lädt die App echte US-Kurse.</small></label><label>EUR/USD-Kurs<input id="d_fx" inputmode="decimal" value="${String(DEP.fx).replace('.',',')}"><small>Zum Umrechnen der Live-Kurse in Euro.</small></label><div class="btns"><button class="btn" data-act="dkey">Speichern</button></div></div></div>`}
function paint(){if(V=='dep'&&!$('#modal').classList.contains('on')){$('#dst').textContent='Kurse in Euro · Stand '+new Date().toLocaleTimeString('de-DE')+' Uhr'+(DEP.live?' · Live-Kurse (Finnhub)':'');$('#stocks').innerHTML=stRows();$('#dsum').innerHTML=sumHtml()}}
async function lq(k){try{const j=await(await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(k)+'&token='+encodeURIComponent(DEP.key))).json();if(j.c>0){DEP.px[k]=j.c/DEP.fx;if(j.pc>0)DEP.ref[k]=j.pc/DEP.fx;DEP.lv[k]=1;return true}}catch(e){}return false}
async function live(){if(!DEP.key)return;let ok=0;for(const a of ALL())if(a[3]&&(DEP.pos[a[0]]||BASE.slice(0,8).some(b=>b[0]==a[0]))&&await lq(a[0]))ok++;DEP.live=ok>0;dsave();paint()}
function dkey(){DEP.key=$('#d_key').value.trim();const f=num($('#d_fx').value);if(f>0)DEP.fx=f;if(!DEP.key){DEP.live=false;DEP.lv={}}dsave();live();toast(DEP.key?'Gespeichert. Lade Live-Kurse …':'Gespeichert.')}
let TS='';
function trade(k){TS=k;if(DEP.key&&ALL().find(a=>a[0]==k)[3])lq(k);const n=ALL().find(a=>a[0]==k)[1],p=px(k),P=DEP.pos[k],R=DEP.rules[k],gl=P?Math.round(P.q*p*100-P.cost):0,rule=P?`<h3 style="font-size:15px;margin-top:20px">Automatisch verkaufen</h3><div class="f" style="max-width:none;margin-top:8px"><label>Verkaufen bei<select id="r_m">${[['p','Gewinn in %'],['e','Gewinn in €'],['v','Positionswert in €']].map(([v,l])=>`<option value="${v}" ${R&&R.m==v?'selected':''}>${l}</option>`).join('')}</select></label><label>Grenze<input id="r_v" inputmode="decimal" value="${R?String(R.v).replace('.',','):''}" placeholder="z. B. 10 oder 1.700"></label><div class="btns"><button class="btn" data-act="rsave">Regel speichern</button>${R?'<button class="btn" data-act="rdel">Regel löschen</button>':''}</div><small>${R?'Aktiv: Verkauf bei '+rtx(R)+'.':'Verkauft die ganze Position, sobald die Grenze erreicht ist.'} Gilt, solange die App geöffnet ist.</small></div>`:'';
 $('#modal').innerHTML=`<div class="sheet"><button class="x" data-close aria-label="Schließen">×</button><small>${k}</small><h3>${n}</h3><div class="big">${eur(Math.round(p*100))}</div>${dl([['Bestand',P?P.q.toFixed(4).replace('.',',')+' Stk. ≈ '+eur(Math.round(P.q*p*100)):'–'],...(P?[['Eingesetzt',eur(Math.round(P.cost))],['Gewinn / Verlust',(gl>=0?'+':'−')+eur(Math.abs(gl))]]:[]),['Verfügbar',eur(DB.end)]])}<div class="f" style="max-width:none;margin-top:12px"><label>Betrag (€)<input id="t_a" inputmode="decimal" placeholder="z. B. 500,00"></label><div class="btns"><button class="btn pri" data-act="buy">Kaufen</button><button class="btn" data-act="sell">Verkaufen</button>${P?'<button class="btn" data-act="all">Alles verkaufen</button>':''}</div><div id="tmsg" class="err" style="font-weight:600"></div></div>${rule}</div>`;$('#modal').classList.add('on')}
function tdo(m){const k=TS,n=ALL().find(a=>a[0]==k)[1],p=px(k),P=DEP.pos[k]||{q:0,cost:0},E=t=>$('#tmsg').textContent=t;
 const a=m=='all'?Math.round(P.q*p*100):Math.round(num($('#t_a').value)*100);if(!(a>0))return E('Bitte einen Betrag eingeben.');
 let q=m=='all'?P.q:a/100/p;
 if(m=='buy'){if(a>DB.end)return E('Nicht genug Guthaben auf dem Konto.');DEP.pos[k]={q:P.q+q,cost:P.cost+a}}
 else{if(q>P.q+.01/p)return E('So viel besitzt du nicht.');q=Math.min(q,P.q);DEP.pos[k]={q:P.q-q,cost:P.cost*(1-q/P.q)};if(DEP.pos[k].q<1e-6){delete DEP.pos[k];delete DEP.rules[k]}}
 book('Depot · '+n,'Wertpapiere',m=='buy'?-a:a,'Überweisung',(m=='buy'?'Kauf ':'Verkauf ')+q.toFixed(4).replace('.',',')+' Stk. '+n+' zu '+eur(Math.round(p*100)));
 dsave();$('#modal').classList.remove('on');keepRender();toast((m=='buy'?'Gekauft: ':'Verkauft: ')+eur(a))}
function savm(){$('#modal').innerHTML=`<div class="sheet"><button class="x" data-close aria-label="Schließen">×</button><small>Spardepot · Festzins ${SAVR} % p. a.</small><h3>Spardepot</h3><div class="big p">${eur(Math.round(sav()))}</div>${dl([['Verfügbar auf dem Konto',eur(DB.end)],['Zuwachs pro Tag','+'+eur(Math.round(sav()*SAVR/36500))]])}<div class="f" style="max-width:none;margin-top:12px"><label>Betrag (€)<input id="t_a" inputmode="decimal" placeholder="z. B. 1.000,00"></label><div class="btns"><button class="btn pri" data-act="sdep">Einzahlen</button><button class="btn" data-act="swd">Auszahlen</button></div><div id="tmsg" class="err" style="font-weight:600"></div></div></div>`;$('#modal').classList.add('on')}
function sdo(m){const a=Math.round(num($('#t_a').value)*100),v=sav(),E=t=>$('#tmsg').textContent=t;if(!(a>0))return E('Bitte einen Betrag eingeben.');
 if(m=='sdep'){if(a>DB.end)return E('Nicht genug Guthaben auf dem Konto.');DEP.sav={b:v+a,t:Date.now(),in:(DEP.sav.in||0)+a}}
 else{if(a>v+1)return E('So viel liegt nicht im Spardepot.');DEP.sav={b:Math.max(0,v-a),t:Date.now(),in:Math.max(0,(DEP.sav.in||0)-a)}}
 book('Spardepot','Sparen',m=='sdep'?-a:a,'Überweisung',m=='sdep'?'Übertrag auf das Spardepot':'Auszahlung vom Spardepot');
 dsave();$('#modal').classList.remove('on');keepRender();toast(m=='sdep'?'Eingezahlt: '+eur(a):'Ausgezahlt: '+eur(a))}
const hit=(P,p,r)=>{const v=P.q*p*100,g=v-P.cost;return r.m=='p'?P.cost>0&&g/P.cost*100>=r.v:r.m=='e'?g>=r.v*100:v>=r.v*100},rtx=r=>r.m=='p'?'Gewinn von '+String(r.v).replace('.',',')+' %':r.m=='e'?'Gewinn von '+eur(r.v*100):'Positionswert von '+eur(r.v*100);
function rsave(){const m=$('#r_m').value,v=num($('#r_v').value),P=DEP.pos[TS],E=t=>$('#tmsg').textContent=t;if(!P)return;if(!(v>0))return E('Bitte eine Grenze größer 0 eingeben.');
 if(hit(P,px(TS),{m,v}))return E('Diese Grenze ist schon erreicht. Wähle eine höhere.');
 DEP.rules[TS]={m,v};dsave();$('#modal').classList.remove('on');keepRender();toast('Auto-Verkauf gespeichert: bei '+rtx({m,v}))}
function rdel(){delete DEP.rules[TS];dsave();$('#modal').classList.remove('on');keepRender();toast('Regel gelöscht.')}
function auto(){if($('#modal').classList.contains('on'))return;let done=false;
 for(const k of Object.keys(DEP.rules)){const P=DEP.pos[k],r=DEP.rules[k];if(!P){delete DEP.rules[k];continue}const p=px(k);
  if(hit(P,p,r)){const n=ALL().find(a=>a[0]==k)[1],a=Math.round(P.q*p*100);book('Depot · '+n,'Wertpapiere',a,'Überweisung','Automatischer Verkauf bei '+rtx(r)+': '+P.q.toFixed(4).replace('.',',')+' Stk. '+n+' zu '+eur(Math.round(p*100)));delete DEP.pos[k];delete DEP.rules[k];dsave();toast('Automatisch verkauft: '+n+' für '+eur(a));done=true}}
 if(done&&V!='set')keepRender()}
dayRef();live();auto();setInterval(()=>{dayRef();ALL().forEach(([k])=>{if(!(DEP.live&&DEP.lv[k]))DEP.px[k]=Math.max(.01,px(k)*(1+(Math.random()-.5)*.003))});auto();dsave();paint()},5000);setInterval(live,60000);
/* ===== FACE-ID-SPERRE (WebAuthn) ===== */
const LK=()=>{try{return localStorage.getItem('pzbd.lock')}catch(x){return null}};
const b2u=b=>Uint8Array.from(atob(b.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const u2b=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rb=n=>crypto.getRandomValues(new Uint8Array(n));let authing=false;
async function auth(){authing=true;try{await navigator.credentials.get({publicKey:{challenge:rb(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:b2u(LK()),transports:['internal','hybrid']}],userVerification:'required',timeout:60000}})}finally{setTimeout(()=>authing=false,1000)}}
async function unlock(){try{await auth();document.body.classList.remove('locked');$('#lmsg').textContent=''}catch(e){$('#lmsg').textContent='Entsperren nicht möglich ('+(e.name||'Fehler')+'). Bitte erneut versuchen.'}}
async function lockOn(){authing=true;try{if(!window.PublicKeyCredential)throw{name:'nicht unterstützt'};const c=await navigator.credentials.create({publicKey:{challenge:rb(32),rp:{name:'Meridian',id:location.hostname},user:{id:rb(16),name:'paul',displayName:'Paul Zeismann'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},attestation:'none',timeout:60000}});localStorage.setItem('pzbd.lock',u2b(c.rawId));keepRender();toast('Face-ID-Sperre eingeschaltet.')}catch(e){toast('Einschalten nicht möglich ('+(e.name||'Fehler')+').')}finally{setTimeout(()=>authing=false,1000)}}
async function lockOff(){try{await auth();localStorage.removeItem('pzbd.lock');keepRender();toast('Sperre ausgeschaltet.')}catch(e){toast('Ausschalten abgebrochen.')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&LK()&&!authing)document.body.classList.add('locked')});
if(LK())document.body.classList.add('locked');
render();
</script></body></html>
